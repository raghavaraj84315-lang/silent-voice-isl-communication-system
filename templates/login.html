<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Voice - Authentication Portal</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('silent_voice_theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151d2c', 900: '#0f172a', 950: '#070a13' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-[#070a13] text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-200">

    <!-- Subtle Ambient Lighting -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-sky-500/10 dark:bg-sky-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-500/10 dark:bg-indigo-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Top Floating Theme Toggle -->
    <div class="absolute top-5 right-5 z-20">
        <button id="theme-toggle-btn" onclick="toggleTheme()" class="p-2.5 rounded-2xl bg-white/80 dark:bg-slate-900/80 border border-slate-200 dark:border-white/10 text-slate-700 dark:text-slate-300 shadow-sm transition hover:scale-105" title="Toggle Dark / Light Theme">
            <svg id="theme-sun" class="w-4 h-4 text-amber-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg id="theme-moon" class="w-4 h-4 text-indigo-600 dark:text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        </button>
    </div>

    <div class="w-full max-w-md relative z-10">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl overflow-hidden border border-sky-500/30 shadow-xl shadow-sky-500/10 bg-slate-950 p-1 mb-3.5">
                <img src="/static/logo_icon.png" alt="Silent Voice Logo" class="w-full h-full object-cover rounded-xl">
            </div>
            <h1 class="text-2xl font-black tracking-tight flex items-center justify-center">
                <span class="text-slate-900 dark:text-white">Silent</span>
                <span class="bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-500 bg-clip-text text-transparent ml-1.5">Voice</span>
            </h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 font-medium mt-1">Sign <span class="text-sky-500">→</span> Text <span class="text-indigo-500">→</span> Voice</p>
        </div>

        <div class="glass-panel rounded-3xl p-6 sm:p-8 border border-slate-200 dark:border-white/10 shadow-2xl relative bg-white/80 dark:bg-slate-950/70">
            <div class="flex items-center bg-slate-100 dark:bg-slate-900/90 p-1 rounded-2xl border border-slate-200 dark:border-white/5 mb-6">
                <button id="tab-login-btn" onclick="showAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-xl bg-sky-600 text-white shadow-md shadow-sky-600/20 transition-all">
                    Sign In
                </button>
                <button id="tab-register-btn" onclick="showAuthTab('register')" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
                    Create Account
                </button>
            </div>

            <div id="auth-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border flex items-center space-x-2">
                <span id="auth-alert-icon"></span>
                <span id="auth-alert-msg" class="flex-1"></span>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Username</label>
                    <div class="relative">
                        <input type="text" id="login-username" required placeholder="Enter username" class="w-full bg-white dark:bg-slate-900/90 text-sm px-4 py-2.5 pl-10 rounded-xl border border-slate-200 dark:border-white/10 focus:outline-none focus:border-sky-500 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition shadow-sm">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" required placeholder="Enter password" class="w-full bg-white dark:bg-slate-900/90 text-sm px-4 py-2.5 pl-10 rounded-xl border border-slate-200 dark:border-white/10 focus:outline-none focus:border-sky-500 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition shadow-sm">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                </div>

                <button type="submit" id="login-submit-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-sky-600 via-blue-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-bold text-sm shadow-md shadow-sky-600/25 transition-all flex items-center justify-center space-x-2">
                    <span>Sign In</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">New Username</label>
                    <div class="relative">
                        <input type="text" id="reg-username" required placeholder="Choose a username" class="w-full bg-white dark:bg-slate-900/90 text-sm px-4 py-2.5 pl-10 rounded-xl border border-slate-200 dark:border-white/10 focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition shadow-sm">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="reg-password" required placeholder="Create a password" class="w-full bg-white dark:bg-slate-900/90 text-sm px-4 py-2.5 pl-10 rounded-xl border border-slate-200 dark:border-white/10 focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition shadow-sm">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">Confirm Password</label>
                    <div class="relative">
                        <input type="password" id="reg-confirm-password" required placeholder="Re-enter password" class="w-full bg-white dark:bg-slate-900/90 text-sm px-4 py-2.5 pl-10 rounded-xl border border-slate-200 dark:border-white/10 focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 transition shadow-sm">
                        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </div>
                </div>

                <button type="submit" id="reg-submit-btn" class="w-full py-3 rounded-xl bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-500 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-sm shadow-md shadow-emerald-600/25 transition-all flex items-center justify-center space-x-2">
                    <span>Create Account</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains("dark");
            const sun = document.getElementById("theme-sun");
            const moon = document.getElementById("theme-moon");
            if (isDark) {
                sun.classList.remove("hidden");
                moon.classList.add("hidden");
            } else {
                sun.classList.add("hidden");
                moon.classList.remove("hidden");
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle("dark");
            localStorage.setItem("silent_voice_theme", isDark ? "dark" : "light");
            updateThemeIcons();
        }

        document.addEventListener("DOMContentLoaded", updateThemeIcons);

        function showAuthTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLoginBtn = document.getElementById('tab-login-btn');
            const tabRegBtn = document.getElementById('tab-register-btn');
            clearAlert();

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLoginBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-sky-600 text-white shadow-md shadow-sky-600/20 transition-all";
                tabRegBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabRegBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl bg-emerald-600 text-white shadow-md shadow-emerald-600/20 transition-all";
                tabLoginBtn.className = "flex-1 py-2 text-xs font-bold rounded-xl text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all";
            }
        }

        function showAlert(msg, isError = true) {
            const alertBox = document.getElementById('auth-alert');
            const alertMsg = document.getElementById('auth-alert-msg');
            const alertIcon = document.getElementById('auth-alert-icon');
            alertBox.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-600', 'text-rose-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-600', 'text-emerald-400');
            if (isError) {
                alertBox.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-600', 'dark:text-rose-400');
                alertIcon.innerHTML = '⚠️';
            } else {
                alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-600', 'dark:text-emerald-400');
                alertIcon.innerHTML = '✅';
            }
            alertMsg.textContent = msg;
        }

        function clearAlert() {
            document.getElementById('auth-alert').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            clearAlert();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value;
            const btn = document.getElementById('login-submit-btn');

            btn.disabled = true;
            btn.innerHTML = '<span>Signing in...</span>';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Authentication failed");
                }
                showAlert("Signed in successfully! Redirecting...", false);
                setTimeout(() => {
                    if (data.role === 'admin') {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/';
                    }
                }, 400);
            } catch (err) {
                showAlert(err.message, true);
                btn.disabled = false;
                btn.innerHTML = '<span>Sign In</span>';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            clearAlert();
            const u = document.getElementById('reg-username').value.trim();
            const p = document.getElementById('reg-password').value;
            const cp = document.getElementById('reg-confirm-password').value;
            const btn = document.getElementById('reg-submit-btn');

            if (p !== cp) {
                showAlert("Passwords do not match", true);
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>Creating Account...</span>';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Registration failed");
                }
                showAlert("Account created! Redirecting to dashboard...", false);
                setTimeout(() => {
                    window.location.href = '/';
                }, 400);
            } catch (err) {
                showAlert(err.message, true);
                btn.disabled = false;
                btn.innerHTML = '<span>Create Account</span>';
            }
        }
    </script>
</body>
</html>
